name: Deploy to Vercel

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_2rfez24A3dfculQ77iGmIBdC
  VERCEL_PROJECT_ID: prj_4ZtgeDUQ0yIVxZdnBG1Hzu5JjVRj
  PRODUCTION_URL: https://shogunx-dashboard.vercel.app
  API_URL: https://shogunx-api-7cf0de1a1fc6.herokuapp.com

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Deploy target
        run: |
          echo "Deploying shogunx-dashboard to Vercel production"
          echo "Ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}"

      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Create a token at https://vercel.com/account/settings/tokens and add it as a repository secret (or under Settings → Environments → production)."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          API_URL: ${{ env.API_URL }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          API_URL: ${{ env.API_URL }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Health check
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
          echo "Checking production alias: $PRODUCTION_URL"
          for i in 1 2 3 4 5; do
            home_ok=$(curl -sS -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/")
            api_ok=$(curl -sS -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/api/v1/dashboard")
            if [ "$home_ok" = "200" ] && [ "$api_ok" = "200" ]; then
              echo "Health check passed (home=$home_ok api=$api_ok)"
              exit 0
            fi
            echo "Waiting for production… home=$home_ok api=$api_ok ($i/5)"
            sleep 5
          done
          echo "::error::Production health check failed (home and /api/v1/dashboard must return 200)"
          exit 1
